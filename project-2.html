<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="project-2.css">
    <link rel="icon" href="icon.png">
</head>
<body>
    <div class="card shadow">
        <h2>🛡️ Gate Keeper 🛡️</h2>
        
        
        <div id="alertPlaceholder"></div>

        <div class="input-section">
            <label for="passInput">Enter to unlock the terminal</label>
            <div class="pass-wrapper">
                <input type="password" id="passInput" placeholder="Scanning requirements...">
                <button type="button" id="showBtn" onclick="togglePassword()">Show</button>
            </div>
        </div>

        <div class="progress-container">
            <div id="strengthBar"></div>
        </div>
        
        <p id="strengthLabel">Strength: <b>Waiting (0%)</b></p>

        <!-- 8 Rules In Grid style -->
        <ul class="rules-grid">
            <li id="rule-len">🔒 8+ Characters</li>
            <li id="rule-up">🔒 Uppercase</li>
            <li id="rule-low">🔒 Lowercase</li>
            <li id="rule-num">🔒 Number</li>
            <li id="rule-spec">🔒 Special Symbol</li>
            <li id="rule-seq">🔒 No Sequences</li>
            <li id="rule-rep">🔒 No Repeats</li>
            <li id="rule-com">🔒 No Common</li>
        </ul>

        <button id="accessBtn" disabled onclick="handleAccess()">Access Restricted</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="project-2.js"></script>
</body>
</html>
